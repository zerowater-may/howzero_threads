<html lang="ko">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인테리어 업체선정 explorer · 봉천동 두산 59A</title>
<style>
  :root{
    --bg:#14171c; --panel:#1b1f27; --panel2:#222732; --border:#2d333b;
    --text:#c9d1d9; --dim:#8b949e; --accent:#58a6ff; --gold:#e3b341;
    --li:#7ee787; --ha:#79c0ff; --ap:#ffa657; --fi:#d2a8ff; --ho:#56d4ba;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif;font-size:14px;line-height:1.5;}
  code,.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;}
  .wrap{display:grid;grid-template-columns:340px 1fr;min-height:100vh;}
  /* ── 좌측 컨트롤 ── */
  .ctrl{background:var(--panel);border-right:1px solid var(--border);padding:18px 16px;overflow-y:auto;height:100vh;position:sticky;top:0;}
  .ctrl h1{font-size:16px;margin:0 0 2px;}
  .sub{color:var(--dim);font-size:12px;margin-bottom:16px;}
  .grp{margin-bottom:18px;}
  .grp h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0 0 8px;border-bottom:1px solid var(--border);padding-bottom:4px;}
  .presets{display:flex;flex-wrap:wrap;gap:6px;}
  .preset{background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:5px 9px;border-radius:14px;font-size:12px;cursor:pointer;transition:.15s;}
  .preset:hover{border-color:var(--accent);color:#fff;}
  .preset.on{background:var(--accent);border-color:var(--accent);color:#08111f;font-weight:600;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 0;}
  .row label{font-size:13px;}
  .row .val{font-size:12px;color:var(--gold);font-variant-numeric:tabular-nums;min-width:54px;text-align:right;}
  input[type=range]{width:100%;accent-color:var(--accent);}
  .slider-row{margin:9px 0;}
  .slider-row .lab{display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px;}
  .slider-row .lab b{color:var(--text);font-weight:500;}
  .slider-row .lab span{color:var(--gold);}
  .toggle{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px;cursor:pointer;}
  .toggle input{accent-color:var(--accent);width:16px;height:16px;}
  /* ── 우측 ── */
  .main{padding:18px 20px 150px;overflow-y:auto;height:100vh;}
  .tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--border);}
  .tab{padding:8px 14px;cursor:pointer;color:var(--dim);font-size:13px;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab.on{color:#fff;border-bottom-color:var(--accent);}
  .view{display:none;}
  .view.on{display:block;}
  /* 업체 카드 */
  .firm{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;border-left:4px solid var(--border);transition:.2s;}
  .firm.over{opacity:.45;}
  .firm .fh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .firm .rank{font-size:13px;color:var(--dim);min-width:24px;}
  .firm .fname{font-size:16px;font-weight:600;}
  .firm .score{margin-left:auto;font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums;}
  .bar{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:8px 0 6px;}
  .bar i{display:block;height:100%;border-radius:4px;transition:width .3s;}
  .firm .meta{font-size:12px;color:var(--dim);display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:6px;}
  .firm .meta b{color:var(--text);font-weight:500;}
  .badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;margin-left:6px;}
  .b-over{background:#5a2a2a;color:#ffb4b4;}
  .b-best{background:#1f4a36;color:#7ee787;}
  .pill{font-size:11px;padding:1px 6px;border-radius:8px;background:var(--panel2);color:var(--dim);}
  /* 아코디언 */
  .acc{background:var(--panel);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden;}
  .acc>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between;}
  .acc>summary::-webkit-details-marker{display:none;}
  .acc>summary::after{content:"▸";color:var(--dim);transition:.2s;}
  .acc[open]>summary::after{transform:rotate(90deg);}
  .acc .body{padding:4px 14px 12px;}
  .acc table{width:100%;border-collapse:collapse;font-size:13px;}
  .acc td{padding:6px 4px;vertical-align:top;border-top:1px solid var(--border);}
  .acc td.k{color:var(--ho);font-weight:500;width:32%;}
  .acc td.m{color:var(--dim);font-size:12px;}
  /* 체크리스트 */
  .q{display:flex;gap:10px;padding:9px 12px;background:var(--panel);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;align-items:flex-start;}
  .q input{margin-top:3px;accent-color:var(--li);width:16px;height:16px;flex:none;}
  .q .qt{font-size:13px;}
  .q .qm{font-size:11px;color:var(--dim);margin-top:2px;}
  .q .imp{font-size:10px;padding:1px 6px;border-radius:8px;margin-left:6px;}
  .imp-필수{background:#5a2a2a;color:#ffb4b4;} .imp-권장{background:#4a3d1f;color:#e3b341;}
  .who{font-size:10px;color:var(--ho);}
  /* 출력 */
  .out{position:fixed;bottom:0;left:340px;right:0;background:var(--panel2);border-top:1px solid var(--border);padding:12px 20px;max-height:240px;overflow-y:auto;}
  .out .oh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .out .oh b{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;}
  .out pre{margin:0;white-space:pre-wrap;font-size:12.5px;line-height:1.55;color:#d6dee6;}
  .copy{background:var(--accent);color:#08111f;border:none;padding:6px 14px;border-radius:7px;font-weight:600;cursor:pointer;font-size:12px;}
  .copy:active{transform:scale(.96);}
  @media(max-width:820px){.wrap{grid-template-columns:1fr;}.ctrl{height:auto;position:static;}.main{height:auto;}.out{left:0;}}
</style>
</head>

function buildControls(){
  // 프리셋
  document.getElementById("presets").innerHTML = Object.keys(PRESETS)
    .map(p=>`<span class="preset" data-p="${p}">${p}</span>`).join("");
  // 가중치
  document.getElementById("weights").innerHTML = WEIGHTS.map(w=>`
    <div class="slider-row">
      <div class="lab"><b>${w.label}</b><span id="wv-${w.key}">${state.w[w.key]}</span></div>
      <input type="range" id="w-${w.key}" min="0" max="5" step="1" value="${state.w[w.key]}">
    </div>`).join("");
  // 필터
  document.getElementById("filters").innerHTML = FILTERS.map(f=>`
    <label class="toggle"><input type="checkbox" id="f-${f.key}"> ${f.label}</label>`).join("");
}

// ===== 점수 계산 =====
function scoreOf(firm){
  const w = state.w;
  const sumW = Object.values(w).reduce((a,b)=>a+b,0) || 1;
  let raw = 0;
  for(const k in w){ raw += (firm.s[k]||0) * w[k]; }
  return raw / sumW; // 0~5
}
function isOverBudget(firm){ return firm.total > state.budget; }
function passesFilters(firm){
  if(state.f.license && firm.license !== true) return false;
  if(state.f.direct && firm.direct !== true) return false;
  if(state.f.as3 && firm.asY < 3) return false;
  if(state.f.budget && isOverBudget(firm)) return false;
  return true;
}

// ===== 렌더: 순위 =====
function renderRank(){
  const list = FIRMS.map(f=>({f, sc:scoreOf(f), pass:passesFilters(f), over:isOverBudget(f)}))
    .filter(x=>x.pass)
    .sort((a,b)=> b.sc - a.sc);
  const best = list.length ? list[0].f.id : null;
  const el = document.getElementById("v-rank");
  if(!list.length){ el.innerHTML = `<p style="color:var(--dim)">조건을 만족하는 업체가 없습니다. 필터를 풀어보세요.</p>`; return; }
  el.innerHTML = list.map((x,i)=>{
    const f=x.f, pct=Math.round(x.sc/5*100);
    return `<div class="firm ${x.over?'over':''}" style="border-left-color:${f.color}">
      <div class="fh">
        <span class="rank">${i+1}위</span>
        <span class="fname" style="color:${f.color}">${f.name}</span>
        ${f.id===best?'<span class="badge b-best">추천</span>':''}
        ${x.over?'<span class="badge b-over">예산초과</span>':''}
        <span class="score">${x.sc.toFixed(2)} / 5</span>
      </div>
      <div class="bar"><i style="width:${pct}%;background:${f.color}"></i></div>
      <div class="meta">
        <span><b>${f.total.toLocaleString()}만</b> ${f.est}</span>
        <span>A/S <b>${f.as}</b></span>
        <span>창호 <b>${f.window}</b></span>
        <span>가구 <b>${f.furn}</b></span>
      </div>
      <div class="meta"><span style="color:var(--li)">👍 ${f.strong}</span></div>
      <div class="meta"><span style="color:#ff9a9a">⚠ ${f.weak}</span></div>
    </div>`;
  }).join("");
}

// ===== 렌더: 홈루덴스 상담 =====
function renderHome(){
  const el = document.getElementById("v-home");
  let html = HOME.map((sec,i)=>`
    <details class="acc" ${i<2?'open':''}>
      <summary>${sec[0]}</summary>
      <div class="body"><table>${sec[1].map(r=>`
        <tr><td class="k">${r[0]}</td><td>${r[1]}${r[2]?`<div class="m">↳ ${r[2]}</div>`:''}</td></tr>`).join("")}
      </table></div>
    </details>`).join("");
  html += `<details class="acc" open><summary>⭐ 디자이너 핵심 조언</summary>
    <div class="body"><table>${ADVICE.map((a,i)=>`<tr><td class="k">${i+1}</td><td>${a}</td></tr>`).join("")}</table></div></details>`;
  el.innerHTML = html;
}

// ===== 렌더: 체크리스트 =====
function renderCheck(){
  const el = document.getElementById("v-check");
  el.innerHTML = `<p style="color:var(--dim);font-size:13px;margin:0 0 10px">6/18 홈루덴스 2차 미팅 등에서 확인할 질문. 체크하면 아래 메모에서 빠집니다.</p>` +
    QS.map((q,i)=>`<label class="q">
      <input type="checkbox" data-q="${i}" ${state.checked[i]?'checked':''}>
      <span><span class="qt">${q.q}</span> <span class="imp imp-${q.imp}">${q.imp}</span>
        <div class="qm">${q.m} · <span class="who">${q.who}</span></div></span>
    </label>`).join("");
  el.querySelectorAll('input[data-q]').forEach(c=>c.addEventListener('change',e=>{
    state.checked[e.target.dataset.q] = e.target.checked; setPreset(null); updatePrompt();
  }));
}

// ===== 출력 =====
function updatePrompt(){
  const ranked = FIRMS.map(f=>({f, sc:scoreOf(f), pass:passesFilters(f)}))
    .filter(x=>x.pass).sort((a,b)=>b.sc-a.sc);
  const wTop = [...WEIGHTS].sort((a,b)=>state.w[b.key]-state.w[a.key])
    .filter(w=>state.w[w.key]>0).slice(0,3).map(w=>w.label);
  const lines = [];
  lines.push("【봉천동 두산 59A(24평형) 인테리어 업체선정】");
  lines.push(`· 예산 상한: ${state.budget.toLocaleString()}만원(VAT포함)`);
  lines.push(`· 내 우선순위: ${wTop.join(" > ") || "(미설정)"}`);
  const fOn = FILTERS.filter(f=>state.f[f.key]).map(f=>f.label);
  if(fOn.length) lines.push(`· 필수 조건: ${fOn.join(", ")}`);
  lines.push("");
  if(ranked.length){
    lines.push("▶ 이 기준 추천 순위:");
    ranked.forEach((x,i)=>lines.push(`  ${i+1}. ${x.f.name} (${x.sc.toFixed(2)}/5, ${x.f.total.toLocaleString()}만)`));
  } else {
    lines.push("▶ 조건을 만족하는 업체 없음 (필터 완화 필요)");
  }
  const todo = QS.map((q,i)=>({q,i})).filter(x=>!state.checked[x.i]);
  lines.push("");
  if(todo.length){
    lines.push(`▶ 미팅에서 확인할 질문 (${todo.length}개):`);
    todo.forEach(x=>lines.push(`  □ [${x.q.imp}] ${x.q.q} (${x.q.who})`));
  } else {
    lines.push("▶ 미팅 질문 전부 확인 완료 ✅");
  }
  lines.push("");
  lines.push("※ 홈루덴스 2차 견적서는 6/18(목) 19시 미팅에서 수령 예정. 받으면 xlsx 시트2 빈칸 입력.");
  document.getElementById("prompt").textContent = lines.join("\n");
}

// ===== 통합 갱신 =====
function updateAll(){
  document.getElementById("budgetV").textContent = state.budget.toLocaleString()+"만";
  WEIGHTS.forEach(w=>{ const v=document.getElementById("wv-"+w.key); if(v) v.textContent=state.w[w.key]; });
  renderRank(); renderHome(); renderCheck(); updatePrompt();
}

function setPreset(name){
  state.preset = name;
  document.querySelectorAll(".preset").forEach(p=>p.classList.toggle("on", p.dataset.p===name));
}
function applyPreset(name){
  const p = PRESETS[name]; if(!p) return;
  state.budget = p.budget;
  state.w = {...p.w};
  state.f = {license:false, direct:false, as3:false, budget:false, ...p.f};
  // 컨트롤 반영
  document.getElementById("budget").value = state.budget;
  WEIGHTS.forEach(w=>{ document.getElementById("w-"+w.key).value = state.w[w.key]; });
  FILTERS.forEach(f=>{ document.getElementById("f-"+f.key).checked = !!state.f[f.key]; });
  setPreset(name); updateAll();
}

// ===== 이벤트 =====
function bind(){
  document.getElementById("budget").addEventListener("input",e=>{ state.budget=+e.target.value; setPreset(null); updateAll(); });
  WEIGHTS.forEach(w=>document.getElementById("w-"+w.key).addEventListener("input",e=>{
    state.w[w.key]=+e.target.value; setPreset(null); updateAll(); }));
  FILTERS.forEach(f=>document.getElementById("f-"+f.key).addEventListener("change",e=>{
    state.f[f.key]=e.target.checked; setPreset(null); updateAll(); }));
  document.querySelectorAll(".preset").forEach(p=>p.addEventListener("click",()=>applyPreset(p.dataset.p)));
  document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
    document.querySelectorAll(".view").forEach(x=>x.classList.remove("on"));
    t.classList.add("on"); document.getElementById("v-"+t.dataset.v).classList.add("on");
  }));
  document.getElementById("copyBtn").addEventListener("click",()=>{
    navigator.clipboard.writeText(document.getElementById("prompt").textContent).then(()=>{
      const b=document.getElementById("copyBtn"); const t=b.textContent; b.textContent="✓ 복사됨!";
      setTimeout(()=>b.textContent=t,1200);
    });
  });
}

buildControls(); bind(); updateAll();
</script>
</body>
</html>
