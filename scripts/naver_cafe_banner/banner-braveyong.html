<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>용감한 용팀장 배너</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 960px; height: 360px; overflow: hidden; }
  body {
    background: #FFFFFF;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #0A0A0A;
    -webkit-font-smoothing: antialiased;
  }
  .banner {
    width: 960px;
    height: 360px;
    padding: 40px 48px;
    display: grid;
    grid-template-columns: 220px 1fr;
    column-gap: 40px;
    align-items: center;
  }

  /* 좌측: 원형 인물 + 이름 + 정체 */
  .left {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 14px;
  }
  .portrait {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: 2px solid #0A0A0A;
    overflow: hidden;
    background: #F4F4F4;
  }
  .portrait img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(100%);
  }
  .name {
    font-size: 24px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.02em;
    line-height: 1.1;
    color: #0A0A0A;
  }
  .role {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: rgba(10,10,10,0.55);
    line-height: 1.5;
  }

  /* 우측: 비교 카피 + 손글씨 + CTA */
  .right {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 18px;
  }
  .compare-line {
    font-size: 17px;
    font-weight: 500;
    color: rgba(10,10,10,0.55);
    line-height: 1.4;
  }
  .compare-line s {
    text-decoration-color: rgba(10,10,10,0.4);
    text-decoration-thickness: 1.5px;
  }
  .punch {
    font-size: 36px;
    font-weight: 900;
    line-height: 1.18;
    letter-spacing: -0.03em;
    color: #0A0A0A;
  }
  .marker {
    background-image: linear-gradient(
      180deg,
      transparent 58%,
      #FFD84A 58%,
      #FFD84A 92%,
      transparent 92%
    );
    background-repeat: no-repeat;
    padding: 0 4px;
  }
  .memo {
    font-family: 'Gowun Dodum', 'Pretendard', sans-serif;
    font-size: 16px;
    color: rgba(10,10,10,0.7);
    letter-spacing: -0.01em;
    line-height: 1.4;
  }
  .cta-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 4px;
  }
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #0A0A0A;
    color: #FFFFFF;
    font-size: 15px;
    font-weight: 800;
    padding: 12px 22px;
    border-radius: 999px;
    letter-spacing: -0.01em;
    border: 2px solid #0A0A0A;
  }
  .cta .arrow {
    display: inline-block;
    font-size: 16px;
    transform: translate(0, -1px);
  }
  .cohort {
    font-size: 12px;
    color: rgba(10,10,10,0.5);
    letter-spacing: -0.005em;
  }
</style>
</head>
<body>
<div class="banner">

  <!-- 좌측: 인물 + 이름 -->
  <div class="left">
    <div class="portrait">
      <img src="face.jpg" alt="용감한 용팀장">
    </div>
    <div class="name">용감한<br>용팀장</div>
    <div class="role">현업 셀러 · 부동산 투자자<br>직장인 · 육아 아빠</div>
  </div>

  <!-- 우측: 카피 + CTA -->
  <div class="right">
    <div class="compare-line">
      <s>1만 개를 무작정 올리는 셀러</s>에서
    </div>
    <div class="punch">
      진짜 팔리는 <span class="marker">효자상품 10개</span>를<br>
      만드는 셀러로.
    </div>
    <div class="memo">저도 회사 다니면서, 애 재우고 새벽에 상품 올렸습니다.</div>
    <div class="cta-row">
      <div class="cta">강의 보러가기 <span class="arrow">↗</span></div>
      <div class="cohort">5주 · 줌 보강 포함</div>
    </div>
  </div>

</div>
</body>
</html>
