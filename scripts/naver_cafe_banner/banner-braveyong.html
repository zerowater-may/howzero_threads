<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>용감한 용팀장 배너</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1440px; height: 240px; overflow: hidden; }
  body {
    background: #FFFFFF;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #0A0A0A;
    -webkit-font-smoothing: antialiased;
  }
  .banner {
    width: 1440px;
    height: 240px;
    padding: 28px 56px;
    display: grid;
    grid-template-columns: 260px 1fr auto;
    column-gap: 36px;
    align-items: center;
  }

  /* 좌측: 원형 인물 + 이름 (가로 그룹) */
  .left {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .portrait {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    border: 2px solid #0A0A0A;
    overflow: hidden;
    background: #F4F4F4;
    flex-shrink: 0;
  }
  .portrait img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(100%);
  }
  .name-block {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .name {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 1.05;
    color: #0A0A0A;
    white-space: nowrap;
  }
  .role {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: rgba(10,10,10,0.55);
    line-height: 1.4;
    white-space: nowrap;
  }

  /* 중앙: 비교 카피 + punch 한 줄 */
  .middle {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 8px;
    min-width: 0;
  }
  .compare-line {
    font-size: 15px;
    font-weight: 500;
    color: rgba(10,10,10,0.55);
    line-height: 1.3;
  }
  .compare-line s {
    text-decoration-color: rgba(10,10,10,0.4);
    text-decoration-thickness: 1.5px;
  }
  .punch {
    font-size: 34px;
    font-weight: 900;
    line-height: 1.15;
    letter-spacing: -0.035em;
    color: #0A0A0A;
    white-space: nowrap;
  }
  .marker {
    background-image: linear-gradient(
      180deg,
      transparent 58%,
      #FFD84A 58%,
      #FFD84A 92%,
      transparent 92%
    );
    background-repeat: no-repeat;
    padding: 0 4px;
  }

  /* 우측: CTA + cohort */
  .right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #0A0A0A;
    color: #FFFFFF;
    font-size: 16px;
    font-weight: 800;
    padding: 14px 26px;
    border-radius: 999px;
    letter-spacing: -0.01em;
    border: 2px solid #0A0A0A;
    white-space: nowrap;
  }
  .cta .arrow {
    display: inline-block;
    font-size: 17px;
    transform: translate(0, -1px);
  }
  .cohort {
    font-size: 12px;
    color: rgba(10,10,10,0.5);
    letter-spacing: -0.005em;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="banner">

  <!-- 좌측: 인물 + 이름 -->
  <div class="left">
    <div class="portrait">
      <img src="face.jpg" alt="용감한 용팀장">
    </div>
    <div class="name-block">
      <div class="name">용감한 용팀장</div>
      <div class="role">현업 셀러 · 부동산 투자자</div>
    </div>
  </div>

  <!-- 중앙: 카피 -->
  <div class="middle">
    <div class="compare-line">
      <s>1만 개를 무작정 올리는 셀러</s>에서
    </div>
    <div class="punch">
      진짜 팔리는 <span class="marker">효자상품 10개</span>를 만드는 셀러로.
    </div>
  </div>

  <!-- 우측: CTA -->
  <div class="right">
    <div class="cta">강의 보러가기 <span class="arrow">↗</span></div>
    <div class="cohort">5주 · 줌 보강 포함</div>
  </div>

</div>
</body>
</html>
