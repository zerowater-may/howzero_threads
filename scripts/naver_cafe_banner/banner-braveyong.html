<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>용감한 용팀장 배너</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 960px; height: 360px; overflow: hidden; }
  body {
    background: #FFFFFF;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #0A0A0A;
  }
  .banner {
    width: 960px;
    height: 360px;
    padding: 44px 56px;
    position: relative;
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-rows: auto 1fr auto;
    column-gap: 32px;
    row-gap: 0;
  }
  .label {
    grid-column: 1 / -1;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: #8A8A8A;
    text-transform: uppercase;
  }
  .headline {
    grid-column: 1 / -1;
    align-self: center;
    font-size: 58px;
    font-weight: 900;
    line-height: 1.12;
    letter-spacing: -0.025em;
    margin-top: 4px;
  }
  .headline .marker {
    font-family: 'Gaegu', 'Pretendard', cursive;
    color: #E0301E;
    font-weight: 700;
    display: inline-block;
    transform: rotate(-1.2deg);
    border-bottom: 4px solid #E0301E;
    padding: 0 2px;
  }
  .right-stamp {
    grid-row: 2;
    grid-column: 2;
    align-self: center;
    font-family: 'Gaegu', cursive;
    color: #E0301E;
    font-size: 22px;
    transform: rotate(6deg);
    border: 2px solid #E0301E;
    border-radius: 50%;
    width: 110px;
    height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.1;
    padding: 6px;
  }
  .footer {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .sub {
    font-size: 18px;
    font-weight: 500;
    line-height: 1.5;
    color: #404040;
  }
  .sub b { color: #0A0A0A; font-weight: 700; }
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #0A0A0A;
    color: #FFFFFF;
    font-size: 18px;
    font-weight: 800;
    padding: 16px 26px;
    border-radius: 10px;
    letter-spacing: -0.01em;
  }
</style>
</head>
<body>
<div class="banner">
  <div class="label">용감한 용팀장 · GIGCLASS</div>
  <div class="headline">감으로 올리지 마세요.<br><span class="marker">데이터로 파세요.</span></div>
  <div class="right-stamp">팩폭<br>주의</div>
  <div class="footer">
    <div class="sub"><b>스마트스토어 · 쿠팡 · 구매대행</b><br>SEO부터 상세페이지까지</div>
    <div class="cta">강의 보러가기 →</div>
  </div>
</div>
</body>
</html>
