<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>불사자 배너</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 960px; height: 360px; overflow: hidden; }
  body {
    background: #FAF6F0;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #2A2520;
  }
  .banner {
    width: 960px;
    height: 360px;
    padding: 44px 56px;
    position: relative;
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-rows: auto 1fr auto;
    column-gap: 32px;
  }
  .label {
    grid-column: 1;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: #8B7E6E;
    text-transform: uppercase;
  }
  .badge {
    grid-column: 2;
    grid-row: 1;
    justify-self: end;
    background: #FFFFFF;
    border: 1px solid #E5DFD2;
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    color: #5A4F44;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .badge .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #FF5A00;
  }
  .headline {
    grid-column: 1 / -1;
    align-self: center;
    font-size: 64px;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.03em;
  }
  .footer {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .sub {
    font-size: 18px;
    font-weight: 500;
    line-height: 1.55;
    color: #5A4F44;
  }
  .sub b { color: #2A2520; font-weight: 700; }
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #FF5A00;
    color: #FFFFFF;
    font-size: 18px;
    font-weight: 800;
    padding: 16px 28px;
    border-radius: 10px;
    letter-spacing: -0.01em;
  }
</style>
</head>
<body>
<div class="banner">
  <div class="label">BULSAJA · 불사자</div>
  <div class="badge"><span class="dot"></span>4050 사장님 옆에 24시간</div>
  <div class="headline">사장님 옆에 AI 팀.</div>
  <div class="footer">
    <div class="sub"><b>상품명 · 키워드 · 광고</b>까지<br>클릭 한 번에 끝</div>
    <div class="cta">지금 사용해보기 →</div>
  </div>
</div>
</body>
</html>
