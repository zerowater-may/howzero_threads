<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>불사자 라이브 — 네이버 1000개 정책</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body {
    background: #FAF6F0;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #1A1814;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  /* 옅은 텍스처 노이즈 — 종이 질감 */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 12% 18%, rgba(255,90,0,0.05) 0, transparent 38%),
      radial-gradient(circle at 88% 90%, rgba(26,24,20,0.05) 0, transparent 42%);
    pointer-events: none;
  }

  .frame {
    position: relative;
    width: 1280px;
    height: 720px;
    padding: 56px 72px 56px 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* 상단 바: LIVE 배지 + 브랜드 wordmark */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #E11D2A;
    color: #FFFFFF;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 0.14em;
    padding: 12px 22px 12px 18px;
    border-radius: 999px;
    box-shadow: 0 4px 16px rgba(225, 29, 42, 0.28);
  }
  .live-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #FFFFFF;
    box-shadow: 0 0 0 4px rgba(255,255,255,0.25);
  }
  .brand-mark {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.01em;
    color: rgba(26,24,20,0.7);
  }
  .brand-mark .dot-orange {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #FF5A00;
  }

  /* 중앙: 큰 카피 */
  .main {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-top: -8px;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-size: 26px;
    font-weight: 800;
    color: #1A1814;
    letter-spacing: -0.015em;
    background: rgba(26,24,20,0.06);
    padding: 10px 18px;
    border-radius: 999px;
    align-self: flex-start;
  }
  .eyebrow .credential {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .eyebrow .x-mark {
    color: #FF5A00;
    font-weight: 900;
  }
  .eyebrow .credential-tail {
    color: rgba(26,24,20,0.6);
    font-weight: 700;
  }
  .headline {
    font-size: 124px;
    font-weight: 900;
    line-height: 1.02;
    letter-spacing: -0.045em;
    color: #1A1814;
  }
  .headline .number {
    color: #FF5A00;
  }
  .headline .underline {
    display: inline-block;
    position: relative;
  }
  .headline .underline::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: 6px;
    height: 14px;
    background: rgba(255, 90, 0, 0.18);
    z-index: -1;
  }
  .subhead {
    font-size: 64px;
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: -0.035em;
    color: #1A1814;
    margin-top: 18px;
  }
  .subhead .accent {
    color: #1A1814;
    border-bottom: 6px solid #1A1814;
    padding-bottom: 2px;
  }

  /* 하단: 호스트/시간 */
  .bottom {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }
  .meta-left {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .meta-label {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: rgba(26,24,20,0.5);
  }
  .meta-value {
    font-size: 24px;
    font-weight: 800;
    color: #1A1814;
    letter-spacing: -0.015em;
  }
  .meta-right {
    text-align: right;
  }
  .meta-right .topic-tag {
    display: inline-block;
    font-size: 14px;
    font-weight: 700;
    color: #1A1814;
    background: rgba(26,24,20,0.06);
    padding: 8px 14px;
    border-radius: 8px;
    letter-spacing: -0.005em;
  }
</style>
</head>
<body>
<div class="frame">

  <!-- 상단 -->
  <div class="top">
    <div class="live-badge">
      <span class="live-dot"></span>
      LIVE
    </div>
    <div class="brand-mark">
      <span class="dot-orange"></span>
      불사자 × 하우제로
    </div>
  </div>

  <!-- 메인 카피 -->
  <div class="main">
    <div class="eyebrow">
      <span class="credential">월매출 1억 셀러 <span class="x-mark">×</span> AI 개발자</span>
      <span class="credential-tail">가 직접 짚어드립니다</span>
    </div>
    <div class="headline">
      <span class="number">1,000개</span> <span class="underline">정책</span>
    </div>
    <div class="subhead">
      무작정 올리던 시대,<br>
      <span class="accent">이제 끝납니다.</span>
    </div>
  </div>

  <!-- 하단 메타 -->
  <div class="bottom">
    <div class="meta-left">
      <div class="meta-label">HOSTED BY</div>
      <div class="meta-value">불사자</div>
    </div>
    <div class="meta-right">
      <div class="topic-tag">#스마트스토어  #상품등록  #정책대응</div>
    </div>
  </div>

</div>
</body>
</html>
