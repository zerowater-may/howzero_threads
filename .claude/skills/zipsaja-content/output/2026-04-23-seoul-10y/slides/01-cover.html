<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>seoul-10y 01</title>
<link rel="stylesheet" href="../../../../../../.claude/skills/zipsaja-design/colors_and_type.css">
<style>
  /* Slide chrome — 자체완결 (zipsaja-design slide.css에 의존하지 않음) */
  html, body { margin: 0; padding: 0; background: var(--zs-page); }
  .zs-slide {
    position: relative;
    width: 1080px; height: 1440px;
    background: var(--zs-page);     /* 베이지 캔버스 */
    box-sizing: border-box;
    overflow: hidden;
    margin: 0 auto;
    font-family: var(--ff-body);
    color: var(--fg-1);
  }
  /* Page number tag (top-right) */
  .zs-num {
    position: absolute; top: 50px; right: 80px;
    font-family: var(--ff-headline); font-size: 28px;
    background: var(--zs-yellow);
    border: 3px solid var(--zs-ink);
    border-radius: 999px;
    padding: 4px 18px;
    color: var(--zs-ink);
    z-index: 10;
  }
  /* Footer (bottom — fixed) */
  .zs-foot {
    position: absolute; left: 80px; right: 80px; bottom: 50px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--ff-headline); font-size: 22px;
    color: var(--fg-3);
    z-index: 5;
  }
  .zs-foot .handle b {
    font-family: var(--ff-body); font-weight: 700; font-size: 22px;
    color: var(--zs-ink);
  }
  .zs-foot .right { display: flex; align-items: center; gap: 12px; font-size: 24px; }
  .zs-foot .pg { color: var(--fg-3); }
</style>

<style>
  /* Cover — 옛 손작업 톤: 손글씨 eyebrow + 인라인 pill + 크림 box stamp + 마스코트 정착 */
  .cv-wrap { padding: 60px 80px 0; }

  .cv-eyebrow {
    font-family: var(--ff-hand); font-weight: 700;
    font-size: 40px; color: var(--fg-3);
    margin: 60px 0 18px;
  }

  .cv-headline {
    font-family: var(--ff-headline);
    font-size: 110px; line-height: 1.1;
    letter-spacing: -2px;
    margin: 0 0 32px;
    max-width: 720px;
  }
  .cv-headline .zs-pill {
    font-size: 110px;
    padding: 4px 28px 12px;
    line-height: 1.1;
    white-space: nowrap;
  }

  .cv-arrow {
    font-family: var(--ff-headline);
    font-size: 64px; line-height: 1.1;
    margin: 0 0 40px;
  }

  .cv-subnote {
    display: inline-block;
    background: var(--zs-cream);
    border: 3px solid var(--zs-ink);
    border-radius: 16px;
    box-shadow: 4px 4px 0 0 var(--zs-ink);
    padding: 18px 32px;
    font-family: var(--ff-headline);
    font-size: 34px;
  }

  .cv-mascot {
    position: absolute;
    right: 50px; bottom: 180px;
    width: 320px; height: 320px;
  }
</style>

</head>
<body>
<section class="zs-slide" data-screen-label="01 cover">
  <div class="zs-num">01</div>
  
<div class="cv-wrap">
  <div class="cv-eyebrow">데이터로 본 부동산 10년</div>

  <h1 class="cv-headline">10년간 서울<br><span class="zs-pill">어디가 올랐나?</span></h1>

  <div class="cv-arrow">→</div>

  
    <div class="cv-subnote">실거래 238만건 · 25개 구 비교</div>
  
</div>

<img src="/Users/zerowater/Dropbox/zerowater/howzero/.claude/skills/zipsaja-design/assets/mascots/mascot-hero.png" class="cv-mascot" alt="">

  <div class="zs-foot">
    <div class="handle"><b>@zipsaja · 서울 300세대+ 1,377단지 · 활성 매물 42,048건 · 2026-04-23 기준</b></div>
    <div class="right"><span class="pg">1 / 7</span><span>→</span></div>
  </div>
</section>
</body>
</html>
