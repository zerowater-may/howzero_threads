services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: axweb
      POSTGRES_USER: axweb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axweb_dev_2026}
    ports:
      - "5434:5432"
    volumes:
      - ax_postgres_data:/var/lib/postgresql/data

volumes:
  ax_postgres_data:
